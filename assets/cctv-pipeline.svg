<title id="title">CCTV inference inputs, decisions and training path</title><desc id="desc">Video is sampled at one frame per second. One frame or the last four frames, plus fixed questions, enter Laya-Vision. It returns an anomaly score and a six-way event distribution. Thresholds produce alarms. XML labels are used only in offline training and evaluation. All thumbnails and numerical outputs are illustrative.</desc>
