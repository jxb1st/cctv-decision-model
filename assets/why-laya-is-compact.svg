<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="675" viewBox="0 0 1320 675" role="img" aria-labelledby="title desc">
<title id="title">Why Laya-Vision is small and how its decision output differs</title><desc id="desc">The 201M checkpoint starts with a compact SmolVLM backbone and retains 20 of its 30 language layers. It produces option scores directly rather than generating explanatory text. Compact networks and layer removal reduce parameter count; direct scoring avoids autoregressive answer generation. RLCD is a training objective, not a new language-model architecture. Qwen in this experiment also uses direct first-token scoring.</desc>
