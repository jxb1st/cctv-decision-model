<title id="title">How the reported CCTV fine-tune updates Laya-Vision</title><desc id="desc">The experiment report describes single-frame RLCD fine-tuning of the decision head and last four language layers, with the vision encoder frozen. Image and question enter the model; XML-derived targets feed the training objective only. A conceptual update loop is shown without measured probabilities. The pinned upstream VLM objective combines cross-entropy and a policy-gradient term, but the CCTV run&#x27;s loss coefficients and schedule have not been audited. Temperature fitting was attempted on held-out training videos; the reported calibration remained poor. Testing uses separate test videos.</desc>
