<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1600" viewBox="0 0 540 1600" role="img" aria-labelledby="title desc">
<title id="title">Inside the 201M Laya-Vision model</title><desc id="desc">The selected checkpoint uses a SigLIP vision tower, a pixel-shuffle connector, and a SmolLM2 language backbone reduced to 20 layers. Image tokens and text enter the backbone, then a two-layer bidirectional decision head scores option markers. Temperature scaling and softmax return binary anomaly and six-way event outputs. The CCTV fine-tune updates the final four language layers and decision head.</desc>
