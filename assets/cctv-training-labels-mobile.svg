<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1820" viewBox="0 0 540 1820" role="img" aria-labelledby="title desc">
<title id="title">How CCTV annotations become training examples</title><desc id="desc">Illustration of the reported label rule. The original dataset contains video and XML event type, start time and duration, rather than written question-answer pairs. A hypothetical falling event from 20 to 30 seconds gives normal labels at 15 and 35 seconds and a falling label at 25 seconds. Fixed anomaly and event questions are paired with frames and XML-derived targets. These are conceptual examples, not exported training records. The reported L3 result uses one frame per decision and only falling and abandoned-object event data.</desc>
