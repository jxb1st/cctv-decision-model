<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1740" viewBox="0 0 540 1740" role="img" aria-labelledby="title desc">
<title id="title">Jev, Laya and Laya-Vision: what each model does</title><desc id="desc">Jev is TypeSafe&#x27;s hosted decision service. Laya is an independent open-source text decision model with a compatible API, not an official release of Jev&#x27;s weights. Laya-Vision is an independent code fork of Laya that adds image input using a small vision-language backbone. This CCTV experiment uses Laya-Vision directly, without a Jev API call. Shared outputs include choices, scores and yes/no probabilities.</desc>
